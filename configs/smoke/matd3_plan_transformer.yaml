algorithm:
  name: matd3_plan_transformer
  hidden_dims:
  - 128
  - 128
  actor_lr: 0.0002
  actor_max_grad_norm: 1.0
  critic_lr: 0.0003
  gamma: 1.0
  tau: 0.005
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  batch_size: 8
  replay_capacity: 256
  warmup_steps: 8
  exploration_noise: 0.15
  network:
    embed_dim: 32
    num_heads: 4
    num_layers: 2
    hidden_dim: 64
    forecast_horizon: 24
    dropout: 0.0
  auxiliary_plan:
    enabled: true
    lambda_plan: 0.1
    lambda_dyn: 0.01
    lambda_first: 0.05
    capacity: 2048
    batch_size: 4
    capture_hours:
    - 0
    - 6
    - 12
    - 18
    teacher:
      population: 4
      elite: 2
      iterations: 1
      initial_std: 0.5
      min_std: 0.05
      update_rate: 0.5
      max_labels: 12
runtime:
  cpu_threads: 1
training:
  episodes: 3
  test_episodes: 2
learning_curve:
  enabled: false
  interval_steps: 600
  eval_episodes: 10
  deterministic_policy: true
  fixed_scenarios: true
  evaluate_initial_policy: true
  seed: 424242
validation:
  enabled: true
  interval: 1
  deterministic_policy: true
  fixed_scenarios: true
  selection:
    mode: physical_constrained_objective
    objective: team_reward_mean
    constraints:
      physical_feasible_day_rate:
        min: 1.0
        atol: 1.0e-07
      power_balance_residual_max_kw:
        max: 0.0
        atol: 1.0e-07
      source_balance_residual_max_kw:
        max: 0.0
        atol: 1.0e-07
      p2p_balance_residual_max_kw:
        max: 0.0
        atol: 1.0e-07
      device_bound_violation_max:
        max: 0.0
        atol: 1.0e-07
      grid_export_max_kw:
        max: 0.0
        atol: 1.0e-07
      unmet_energy_mean_kwh:
        max: 0.0
        atol: 1.0e-07
  max_days: 2
logging:
  diagnostic_interval: 1
  incremental_history: true
  history_snapshot_interval: 500
  dashboard: false
  dashboard_refresh_hz: 4
  rolling_windows:
  - 50
  - 100
  - 500
