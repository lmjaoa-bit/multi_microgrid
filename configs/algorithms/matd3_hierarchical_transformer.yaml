# Hierarchical Categorized-Token Spatio-Temporal Transformer Actor (H=8)
# Features:
#   - 14 Physically Categorized Semantic Tokens (ESS, DR, Supply, Trade, Peer1, Peer2, 8xForecast)
#   - 8-Hour Lookahead Forecast Horizon with Diurnal Clock Embeddings
#   - Heterogeneous DR Encoders (Mill, HVAC, EV with Pacing Rate)
#   - Physical Supply-Demand Balance Token using restored kW and the shared power scale
#   - P2P Trade & System Grid Margin Token for Peak Shaving Coordination
#   - Three Independent Decentralized Actors (MG1, MG2, MG3)
#   - Decoupled Dual Readout Heads with Bilinear Physical Skip / Gate
algorithm:
  name: matd3_hierarchical_transformer
  hidden_dims: [128, 128]
  actor_lr: 0.0002
  actor_max_grad_norm: 1.0
  critic_lr: 0.0003
  gamma: 1.0
  tau: 0.005
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  batch_size: 128
  replay_capacity: 200000
  warmup_steps: 1000
  exploration_noise: 0.15
  network:
    feature_semantics: physical_power_balance_v1
    embed_dim: 32
    num_heads: 4
    num_layers: 2
    hidden_dim: 64
    forecast_horizon: 8
    include_peer_forecast: true
    peer_forecast_features: [energy_balance]
runtime:
  device: cuda
  cpu_threads: 4
  interop_threads: 2
training:
  episodes: 5000
  test_episodes: 55
validation:
  enabled: true
  interval: 100
  deterministic_policy: true
  fixed_scenarios: true
  selection:
    mode: physical_constrained_objective
    objective: team_reward_mean
    constraints:
      physical_feasible_day_rate: {min: 1.0, atol: 1.0e-7}
      power_balance_residual_max_kw: {max: 0.0, atol: 1.0e-7}
      source_balance_residual_max_kw: {max: 0.0, atol: 1.0e-7}
      p2p_balance_residual_max_kw: {max: 0.0, atol: 1.0e-7}
      device_bound_violation_max: {max: 0.0, atol: 1.0e-7}
      grid_export_max_kw: {max: 0.0, atol: 1.0e-7}
      unmet_energy_mean_kwh: {max: 0.0, atol: 1.0e-7}
logging:
  diagnostic_interval: 20
  incremental_history: true
  history_snapshot_interval: 500
  dashboard: true
  dashboard_refresh_hz: 4
  rolling_windows: [50, 100, 500]
