# Short CPU-only validation profile for the new DR environment.
# This is a pipeline/learning-health gate, not a paper-performance configuration.
algorithm:
  name: matd3_dispatch
  hidden_dims: [128, 128]
  actor_lr: 0.0002
  actor_max_grad_norm: 1.0
  critic_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  batch_size: 64
  replay_capacity: 20000
  warmup_steps: 240
  exploration_noise: 0.15
runtime:
  cpu_threads: 1
training:
  episodes: 80
  test_episodes: 12
validation:
  enabled: true
  interval: 20
  deterministic_policy: true
  fixed_scenarios: true
  max_days: 6
logging:
  incremental_history: true
  history_snapshot_interval: 20
  dashboard: false
  dashboard_refresh_hz: 4
  rolling_windows: [20, 50]
