algorithm:
  name: matd3_renewable_p2p_only
  hidden_dims: [128, 128]
  actor_lr: 0.0003
  critic_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  batch_size: 128
  replay_capacity: 200000
  warmup_steps: 1000
  exploration_noise: 0.15

training:
  episodes: 5000
  test_episodes: 55

validation:
  enabled: true
  interval: 100
  deterministic_policy: true
  fixed_scenarios: true

logging:
  dashboard: true
  dashboard_refresh_hz: 4
  rolling_windows: [50, 100, 500]
