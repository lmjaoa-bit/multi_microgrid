# Spatio-Temporal Transformer Dispatch Actor (V2)
# Features:
#   - Absolute Diurnal Forecast Clock-Hour Embeddings
#   - Learnable [DISPATCH] Decision Token with Attention Pooling
#   - Local Battery State Skip Connection
#   - Heterogeneous Attention Scaling (MG1 PV protection)
algorithm:
  name: matd3_transformer
  hidden_dims: [128, 128]
  actor_lr: 0.0002
  actor_max_grad_norm: 1.0
  critic_lr: 0.0003
  gamma: 0.99
  tau: 0.005
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  batch_size: 128
  replay_capacity: 200000
  warmup_steps: 1000
  exploration_noise: 0.15
  network:
    embed_dim: 32
    num_heads: 4
    num_layers: 2
    hidden_dims: [64, 32]
    forecast_horizon: 8
runtime:
  device: cuda
  cpu_threads: 4
  interop_threads: 2
training:
  episodes: 5000
  test_episodes: 55
validation:
  enabled: true
  interval: 100
  deterministic_policy: true
  fixed_scenarios: true
logging:
  diagnostic_interval: 20
  incremental_history: true
  history_snapshot_interval: 500
  dashboard: true
  dashboard_refresh_hz: 4
  rolling_windows: [50, 100, 500]
