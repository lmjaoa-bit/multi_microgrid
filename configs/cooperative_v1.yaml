env:
  name: MultiMicrogridEnv
  seed: 42
  mode: cooperative

data:
  train_path: data/uk_microgrid_2018_train.csv
  val_path: data/uk_microgrid_2018_val.csv
  test_path: data/uk_microgrid_2018_test.csv
  timestamp_col: timestamp

time:
  delta_t: 1.0
  episode_length: 24
  episode_sampling: natural_day

price:
  sell_ratio: 0.50
  override_buy_price_with_tou: false

weather_to_power:
  pv: {irradiance_reference_w_per_m2: 1000.0}
  wind: {cut_in_mps: 3.0, rated_mps: 12.0, cut_out_mps: 25.0}

p2p:
  enabled: true
  mode: cooperative_energy_pool
  loss_rate: 0.0
  pair_capacity_kw: 60.0
  # This forbids importing from the external grid and selling P2P in the same
  # hour. Energy charged from the grid in an earlier hour may still be shared.
  allow_grid_resale: false

ess_sharing:
  control_mode: residual_auto
  observation_mode: local

terminal_soc:
  mode: penalty
  tolerance: 0.03
  penalty_per_kwh: 1.5

observation:
  future_horizon: 4
  noisy_forecast: true
  forecast_sigma_1h: {load: 0.03, ghi: 0.08, wind_speed: 0.10, price: 0.00}

cost:
  unmet_load_cost_per_kwh: 20.0
  renewable_curtailment_cost_per_kwh: 0.02
  reward_scale: 100.0

# Cross-algorithm spatiotemporal study: solar-commercial, wind-flexible, and
# night-flexible hybrid microgrids create changing hourly seller/buyer roles.
microgrids:
  - id: mg1
    type: solar_commercial
    load_profile:
      target_mean_kw: 72.0
      weekend_multiplier: 0.78
      variability_clip: [0.65, 1.45]
      hourly_shape: [0.58,0.56,0.55,0.54,0.55,0.62,0.78,0.92,1.10,1.22,1.28,1.30,1.30,1.28,1.24,1.20,1.12,0.98,0.86,0.78,0.72,0.66,0.62,0.60]
    renewables: {pv_capacity_kw: 340.0, wind_capacity_kw: 35.0}
    battery: {capacity_kwh: 120.0, max_charge_kw: 42.0, max_discharge_kw: 42.0, eta_charge: 0.95, eta_discharge: 0.95, soc_min: 0.10, soc_max: 0.90, initial_soc: 0.55, degradation_cost_per_kwh: 0.01}
    grid: {import_limit_kw: 100.0, export_limit_kw: 100.0}

  - id: mg2
    type: wind_flexible
    load_profile:
      target_mean_kw: 80.0
      weekend_multiplier: 0.95
      variability_clip: [0.65, 1.45]
      hourly_shape: [0.90,0.89,0.88,0.88,0.90,0.94,0.98,1.02,1.06,1.10,1.12,1.13,1.13,1.12,1.10,1.08,1.06,1.05,1.05,1.04,1.02,0.98,0.95,0.92]
    renewables: {pv_capacity_kw: 75.0, wind_capacity_kw: 520.0}
    battery: {capacity_kwh: 180.0, max_charge_kw: 55.0, max_discharge_kw: 55.0, eta_charge: 0.95, eta_discharge: 0.95, soc_min: 0.10, soc_max: 0.90, initial_soc: 0.55, degradation_cost_per_kwh: 0.01}
    grid: {import_limit_kw: 110.0, export_limit_kw: 110.0}

  - id: mg3
    type: night_flexible_hybrid
    load_profile:
      target_mean_kw: 68.0
      weekend_multiplier: 1.05
      variability_clip: [0.65, 1.45]
      hourly_shape: [1.40,1.57,1.69,1.77,1.80,1.77,1.69,1.57,1.40,1.21,1.00,0.79,0.60,0.43,0.31,0.23,0.20,0.23,0.31,0.43,0.60,0.79,1.00,1.21]
    renewables: {pv_capacity_kw: 180.0, wind_capacity_kw: 140.0}
    battery: {capacity_kwh: 105.0, max_charge_kw: 38.0, max_discharge_kw: 38.0, eta_charge: 0.95, eta_discharge: 0.95, soc_min: 0.10, soc_max: 0.90, initial_soc: 0.35, degradation_cost_per_kwh: 0.01}
    grid: {import_limit_kw: 100.0, export_limit_kw: 100.0}
