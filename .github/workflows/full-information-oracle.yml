name: Full-information oracle smoke

on:
  push:
    branches:
      - 'codex/full-information-milp-audit-*'
    paths:
      - '.github/workflows/full-information-oracle.yml'
      - 'optimization/**'
      - 'scripts/run_full_information_oracle.py'
      - 'tests/test_full_information_oracle.py'
      - 'configs/cooperative.yaml'
      - 'components/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install oracle and test dependencies
        run: python -m pip install 'numpy>=1.24' 'pandas>=2.0' 'PyYAML>=6.0' 'highspy>=1.7,<2' 'pytest>=7.0'
      - name: Run oracle unit tests
        run: python -m pytest -q tests/test_full_information_oracle.py
      - name: Solve one actual test day
        run: python scripts/run_full_information_oracle.py --day 2018-04-27 --output oracle_smoke
      - name: Save audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-smoke-audit
          path: oracle_smoke/
          if-no-files-found: ignore
