name: Renewable-first two-algorithm smoke

on:
  push:
    branches: ['代号：噜噜']
    paths:
      - '.github/workflows/renewable-first-two-algorithm-smoke.yml'
      - 'configs/cooperative.yaml'
      - 'configs/smoke/**'
      - 'algorithms/matd3_dispatch/**'
      - 'algorithms/matd3_hierarchical_transformer/**'
      - 'components/**'
      - 'core/**'
      - 'envs/**'
      - 'experiments/**'
      - 'evaluation/**'
      - 'optimization/**'
      - 'utils/**'
      - 'scripts/run_experiment.py'
      - 'scripts/generate_results.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-algorithm-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q algorithms components core envs evaluation experiments optimization scripts tests utils
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check implementation diff whitespace
        run: git diff --check d085ff71be9a...HEAD
      - name: Regenerate Yancheng-area data
        run: python scripts/build_spatial_market_data.py
      - name: Verify Reward V2 shared semantics
        run: |
          python - <<'PY'
          import yaml
          c = yaml.safe_load(open('configs/cooperative.yaml', encoding='utf-8'))
          assert c['dispatch']['priority_mode'] == 'renewable_load_first'
          assert c['terminal_soc']['mode'] == 'none'
          assert c['reward']['semantics_version'] == 'generalized_system_cost_v2'
          assert c['reward']['calibration_status'] == 'locked'
          assert len(c['reward']['calibration_report_sha256']) == 64
          assert all(float(m['grid']['export_limit_kw']) == 0.0 for m in c['microgrids'])
          hvac = next(m['dr'] for m in c['microgrids'] if m['dr']['type'] == 'commercial_hvac')
          ev = next(m['dr'] for m in c['microgrids'] if m['dr']['type'] == 'ev_charging')
          assert hvac['forecast_viability'] is False
          assert hvac['control_semantics'] == 'soft_comfort'
          assert ev['control_semantics'] == 'no_deadline_minimum'
          for path in (
              'configs/smoke/matd3_dispatch.yaml',
              'configs/smoke/matd3_hierarchical_transformer.yaml',
          ):
              a = yaml.safe_load(open(path, encoding='utf-8'))
              assert a['algorithm']['gamma'] == 1.0
              assert a['algorithm']['batch_size'] == 8
              assert a['algorithm']['warmup_steps'] == 8
              assert a['algorithm']['replay_capacity'] == 256
              assert a['logging']['diagnostic_interval'] == 1
              assert a['validation']['selection']['mode'] == 'physical_constrained_objective'
              assert a['validation']['selection']['objective'] == 'team_reward_mean'
          t = yaml.safe_load(open(
              'configs/smoke/matd3_hierarchical_transformer.yaml', encoding='utf-8'
          ))
          assert t['algorithm']['network']['forecast_horizon'] == 8
          assert t['algorithm']['network']['include_peer_forecast'] is True
          assert t['algorithm']['network']['peer_forecast_features'] == ['energy_balance']
          PY
      - name: Run MATD3 short pipeline
        run: >-
          python scripts/run_experiment.py
          --algorithm matd3
          --config configs/cooperative.yaml
          --algorithm-config configs/smoke/matd3_dispatch.yaml
          --episodes 3
          --test-episodes 2
          --validation-interval 1
          --validation-days 2
          --device cpu
          --no-learning-curve
          --no-dashboard
          --output-root /tmp/renewable_first_smoke
      - name: Run ordinary Transformer short pipeline
        run: >-
          python scripts/run_experiment.py
          --algorithm matd3_hierarchical_transformer
          --config configs/cooperative.yaml
          --algorithm-config configs/smoke/matd3_hierarchical_transformer.yaml
          --episodes 3
          --test-episodes 2
          --validation-interval 1
          --validation-days 2
          --device cpu
          --no-learning-curve
          --no-dashboard
          --output-root /tmp/renewable_first_smoke
      - name: Regenerate figures only from saved results
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/renewable_first_smoke')
          for slug in ('matd3_dispatch', 'matd3_hierarchical_transformer'):
              latest = json.loads((root / slug / 'latest_run.json').read_text(encoding='utf-8'))
              print(latest['run_directory'])
          PY
          MATD3_RUN="$(python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/renewable_first_smoke/matd3_dispatch/latest_run.json')
          print(json.loads(root.read_text(encoding='utf-8'))['run_directory'])
          PY
          )"
          T_RUN="$(python - <<'PY'
          import json
          from pathlib import Path
          root=Path('/tmp/renewable_first_smoke/matd3_hierarchical_transformer/latest_run.json')
          print(json.loads(root.read_text(encoding='utf-8'))['run_directory'])
          PY
          )"
          python scripts/generate_results.py --run_dir "$MATD3_RUN"
          python scripts/generate_results.py --run_dir "$T_RUN"
      - name: Verify updates checkpoints contracts and MILP settlement
        run: |
          python - <<'PY'
          import hashlib
          import json
          import math
          from pathlib import Path
          import yaml

          from algorithms.registry import get_algorithm_spec
          from envs.multi_microgrid_env import MultiMicrogridEnv

          root = Path('/tmp/renewable_first_smoke')
          run_dirs = {}
          contracts = {}
          for slug, algorithm_config in (
              ('matd3_dispatch', 'configs/smoke/matd3_dispatch.yaml'),
              ('matd3_hierarchical_transformer', 'configs/smoke/matd3_hierarchical_transformer.yaml'),
          ):
              latest = json.loads((root / slug / 'latest_run.json').read_text(encoding='utf-8'))
              run_dir = Path(latest['run_directory'])
              run_dirs[slug] = run_dir
              history = json.loads((run_dir / 'training_history.json').read_text(encoding='utf-8'))
              training = json.loads((run_dir / 'training_summary.json').read_text(encoding='utf-8'))
              summary = json.loads((run_dir / 'test_summary.json').read_text(encoding='utf-8'))
              metadata = json.loads((run_dir / 'run_metadata.json').read_text(encoding='utf-8'))
              assert len(history) == 3
              assert training['checkpoint_selection']['constraint_eligible'] is True
              critic = [float(x['critic_loss']) for x in history if x.get('critic_loss') is not None]
              actor = [float(x['actor_loss']) for x in history if x.get('actor_loss') is not None]
              assert critic and all(math.isfinite(x) for x in critic)
              assert actor and all(math.isfinite(x) for x in actor)
              best_path = run_dir / 'checkpoints' / 'best_model.pt'
              final_path = run_dir / 'checkpoints' / 'final_model.pt'
              assert best_path.is_file()
              assert final_path.is_file()
              best_sha = hashlib.sha256(best_path.read_bytes()).hexdigest()
              assert summary['checkpoint_used'].endswith('/checkpoints/best_model.pt')
              assert summary['checkpoint_sha256'] == best_sha
              assert len(summary['environment_config_sha256']) == 64
              assert len(summary['algorithm_config_sha256']) == 64
              pngs = sorted((run_dir / 'figures').glob('*.png'))
              pdfs = sorted((run_dir / 'figures').glob('*.pdf'))
              assert len(pngs) == 15, [p.name for p in pngs]
              assert len(pdfs) == 15, [p.name for p in pdfs]
              assert int(summary.get('milp_failure_count', 0)) == 0
              assert int(summary.get('shapley_invalid_day_count', 0)) == 0
              assert float(summary.get('shapley_budget_balance_max_error', 0.0) or 0.0) <= 1e-6
              assert summary['reward_semantics_version'] == 'generalized_system_cost_v2'
              assert summary['generalized_reference_enabled'] is True
              assert int(summary['generalized_reference_solve_count']) == 2
              assert int(summary['generalized_reference_success_count']) == 2
              assert float(summary['generalized_reference_cost_mean']) > 0.0
              contract = metadata['experiment_contract']
              contracts[slug] = contract
              assert contract['dispatch_semantics'] == 'renewable_load_first_v2_no_grid_export'
              assert contract['reward_semantics_version'] == 'generalized_system_cost_v2'
              assert contract['action_semantics'] == 'single_dispatch_dr_v4_instantaneous_physical'
              assert contract['metrics_schema_version'] == 'service_metrics_v2'

              env_cfg = yaml.safe_load(Path('configs/cooperative.yaml').read_text(encoding='utf-8'))
              env_cfg['_project_root'] = str(Path('.').resolve())
              spec = get_algorithm_spec(slug)
              env = MultiMicrogridEnv(spec.build_environment_config(env_cfg), split='train')
              settings = yaml.safe_load(Path(algorithm_config).read_text(encoding='utf-8'))
              model = spec.create(env, settings, device='cpu', seed=999)
              model.load(run_dir / 'checkpoints' / 'best_model.pt')

          assert contracts['matd3_dispatch']['physical_config_hash'] == contracts['matd3_hierarchical_transformer']['physical_config_hash']
          print(json.dumps({
              'matd3_run': str(run_dirs['matd3_dispatch']),
              'transformer_run': str(run_dirs['matd3_hierarchical_transformer']),
              'physical_config_hash': contracts['matd3_dispatch']['physical_config_hash'],
          }, indent=2))
          PY
      - name: Save smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renewable-first-two-algorithm-smoke
          path: /tmp/renewable_first_smoke/
          if-no-files-found: ignore
