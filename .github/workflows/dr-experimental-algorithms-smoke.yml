name: Experimental DR algorithms short pipeline smoke

on:
  push:
    branches: [codex/controllable-devices]
    paths:
      - '.github/workflows/dr-experimental-algorithms-smoke.yml'
      - 'algorithms/dr_environment_adapter.py'
      - 'algorithms/pnn/**'
      - 'algorithms/matd3_transformer/**'
      - 'algorithms/pnn_transformer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  experimental-dr-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate Yancheng-area NASA POWER data
        run: python scripts/build_spatial_market_data.py
      - name: Build short algorithm configs
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for slug in ('pnn', 'matd3_transformer', 'pnn_transformer'):
              source = Path('configs/algorithms') / f'{slug}.yaml'
              cfg = yaml.safe_load(source.read_text(encoding='utf-8'))
              algorithm = cfg.setdefault('algorithm', {})
              algorithm['batch_size'] = 16
              algorithm['warmup_steps'] = 0
              algorithm['replay_capacity'] = 10000
              algorithm['diagnostics_interval'] = 1
              cfg.setdefault('runtime', {})['device'] = 'cpu'
              cfg['runtime']['cpu_threads'] = 1
              cfg.setdefault('training', {})['episodes'] = 2
              cfg['training']['test_episodes'] = 1
              validation = cfg.setdefault('validation', {})
              validation['enabled'] = True
              validation['interval'] = 1
              validation['max_days'] = 1
              target = Path('/tmp') / f'{slug}_smoke.yaml'
              target.write_text(yaml.safe_dump(cfg, sort_keys=False), encoding='utf-8')
          PY
      - name: Run PNN full pipeline smoke
        run: >-
          python scripts/run_experiment.py
          --algorithm pnn
          --algorithm-config /tmp/pnn_smoke.yaml
          --device cpu
          --seed 42
          --no-dashboard
          --output-root /tmp/dr_experimental_smoke
      - name: Run Transformer full pipeline smoke
        run: >-
          python scripts/run_experiment.py
          --algorithm matd3_transformer
          --algorithm-config /tmp/matd3_transformer_smoke.yaml
          --device cpu
          --seed 42
          --no-dashboard
          --output-root /tmp/dr_experimental_smoke
      - name: Run PNN-Transformer full pipeline smoke
        run: >-
          python scripts/run_experiment.py
          --algorithm pnn_transformer
          --algorithm-config /tmp/pnn_transformer_smoke.yaml
          --device cpu
          --seed 42
          --no-dashboard
          --output-root /tmp/dr_experimental_smoke
      - name: Verify full pipeline artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/dr_experimental_smoke')
          for slug in ('pnn', 'matd3_transformer', 'pnn_transformer'):
              algorithm_root = root / slug
              latest = json.loads((algorithm_root / 'latest_run.json').read_text(encoding='utf-8'))
              run_dir = Path(latest['run_directory'])
              summary = json.loads((run_dir / 'summary.json').read_text(encoding='utf-8'))
              history = json.loads((run_dir / 'training_history.json').read_text(encoding='utf-8'))
              validation = json.loads((run_dir / 'validation_history.json').read_text(encoding='utf-8'))

              assert len(history) == 2, (slug, len(history))
              assert len(validation) == 2, (slug, len(validation))
              assert summary['test_days_count'] == 1, (slug, summary['test_days_count'])
              assert (run_dir / 'checkpoints' / 'best_model.pt').is_file(), slug
              assert (run_dir / 'checkpoints' / 'final_model.pt').is_file(), slug
              assert (run_dir / 'test_daily_metrics.csv').is_file(), slug
              assert (run_dir / 'test_summary.json').is_file(), slug
              assert len(list((run_dir / 'figures').glob('*.png'))) == 15, slug
              assert len(list((run_dir / 'figures').glob('*.pdf'))) == 15, slug
              print(slug, run_dir)
          PY
