name: MATD3 DR short validation

on:
  push:
    branches: [codex/controllable-devices]
    paths:
      - '.github/workflows/matd3-dr-short-validation.yml'
      - 'configs/cooperative.yaml'
      - 'configs/algorithms/matd3_dispatch_short_validation.yaml'
      - 'algorithms/matd3_dispatch/**'
      - 'components/**'
      - 'core/**'
      - 'envs/**'
      - 'experiments/**'
      - 'evaluation/**'
      - 'utils/**'
      - 'scripts/run_experiment.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  short-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify canonical projection mode
        run: >-
          python -c "import yaml; c=yaml.safe_load(open('configs/cooperative.yaml', encoding='utf-8')); assert c['constraint_projection']['mode'] == 'strong'"
      - name: Regenerate Yancheng-area data
        run: python scripts/build_spatial_market_data.py
      - name: Run short MATD3 training gate
        run: >-
          python scripts/run_experiment.py
          --algorithm matd3_dispatch
          --config configs/cooperative.yaml
          --algorithm-config configs/algorithms/matd3_dispatch_short_validation.yaml
          --device cpu
          --seed 42
          --no-dashboard
          --no-milp
