name: Apply P2P metrics green patch

on:
  push:
    branches: [codex/controllable-devices]
    paths:
      - '.github/workflows/p2p-metrics-green.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/controllable-devices
          fetch-depth: 0
      - name: Apply minimal metrics patch
        run: |
          python scripts/_apply_p2p_metrics_patch.py
          python -m py_compile utils/metrics_collector.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utils/metrics_collector.py
          git commit -m 'feat: add exact P2P pair-capacity diagnostics'
          git push origin HEAD:codex/controllable-devices
