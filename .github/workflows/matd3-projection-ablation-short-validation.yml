name: MATD3 projection ablation short validation

on:
  push:
    branches: [codex/controllable-devices]
    paths:
      - '.github/workflows/matd3-projection-ablation-short-validation.yml'
      - 'configs/cooperative.yaml'
      - 'configs/cooperative_instantaneous_projection.yaml'
      - 'configs/algorithms/matd3_dispatch_short_validation.yaml'
      - 'algorithms/matd3_dispatch/**'
      - 'core/**'
      - 'envs/**'
      - 'experiments/**'
      - 'evaluation/**'
      - 'utils/**'
      - 'scripts/run_projection_ablation.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  short-train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate Yancheng-area data
        run: python scripts/build_spatial_market_data.py
      - name: Run instantaneous-projection MATD3 gate
        run: >-
          python scripts/run_projection_ablation.py
          --algorithm-config configs/algorithms/matd3_dispatch_short_validation.yaml
          --device cpu
          --seed 42
          --no-dashboard
          --no-milp
