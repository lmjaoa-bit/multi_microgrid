name: Apply shared pair capacity green patch

on:
  push:
    branches: [codex/controllable-devices]
    paths:
      - '.github/workflows/shared-pair-capacity-green.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/controllable-devices
          fetch-depth: 0
      - name: Apply shared-capacity patch
        run: |
          python scripts/_apply_shared_pair_capacity_patch.py
          python -m py_compile optimization/common_constraints.py
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add optimization/common_constraints.py
          git commit -m 'fix: share P2P capacity across oracle directions'
          git push origin HEAD:codex/controllable-devices
