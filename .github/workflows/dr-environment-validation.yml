name: DR environment validation

on:
  push:
    branches: [main, 'codex/**']
    paths:
      - '.github/workflows/dr-environment-validation.yml'
      - 'components/**'
      - 'core/**'
      - 'envs/**'
      - 'algorithms/**'
      - 'configs/**'
      - 'experiments/**'
      - 'evaluation/**'
      - 'optimization/**'
      - 'utils/**'
      - 'scripts/audit_dr_physics.py'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run DR and compatibility tests
        run: >-
          python -m pytest -q
          tests/test_controllable_loads.py
          tests/test_joint_action_projection.py
          tests/test_dr_environment.py
          tests/test_dr_physics_audit.py
          tests/test_experiment_profiles.py
          tests/test_plain_single_dispatch.py
          tests/test_cooperative_physics.py
          tests/test_daily_soc_and_future_prices.py
          tests/test_metrics_recording.py
          tests/test_optimization_and_allocation.py
      - name: Run full regression suite
        run: python -m pytest -q
