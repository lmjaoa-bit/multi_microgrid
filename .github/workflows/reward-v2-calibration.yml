name: Reward V2 calibration evidence

on:
  push:
    branches: ['代号：噜噜']
    paths:
      - '.github/workflows/reward-v2-calibration.yml'
      - 'configs/reward_v2_calibration_diagnostic.yaml'
      - 'configs/diagnostics/matd3_dispatch_reward_v2.yaml'
      - 'core/**'
      - 'components/**'
      - 'envs/**'
      - 'algorithms/matd3_dispatch/**'
      - 'evaluation/reward_calibration.py'
      - 'scripts/run_reward_v2_calibration_bundle.py'
      - 'scripts/run_experiment.py'
      - 'experiments/**'
      - 'utils/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python sources
        run: python -m compileall -q algorithms components core envs evaluation experiments optimization scripts tests utils
      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Regenerate Yancheng-area data
        run: python scripts/build_spatial_market_data.py
      - name: Run short diagnostic MATD3
        run: >-
          python scripts/run_experiment.py
          --algorithm matd3
          --config configs/reward_v2_calibration_diagnostic.yaml
          --algorithm-config configs/diagnostics/matd3_dispatch_reward_v2.yaml
          --episodes 3
          --test-episodes 2
          --device cpu
          --no-validation
          --no-dashboard
          --diagnostic-only
          --output-root /tmp/reward_v2_calibration
      - name: Build train and validation calibration bundle
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          latest = json.loads(
              Path('/tmp/reward_v2_calibration/matd3_dispatch/latest_run.json').read_text(
                  encoding='utf-8'
              )
          )
          run_dir = Path(latest['run_directory'])
          Path('/tmp/reward_v2_run_dir.txt').write_text(str(run_dir), encoding='utf-8')
          print(run_dir)
          PY
          RUN_DIR="$(cat /tmp/reward_v2_run_dir.txt)"
          python scripts/run_reward_v2_calibration_bundle.py             --config configs/reward_v2_calibration_diagnostic.yaml             --algorithm matd3             --algorithm-config configs/diagnostics/matd3_dispatch_reward_v2.yaml             --run-dir "$RUN_DIR"             --train-days 8             --val-days 8             --seed 42
      - name: Verify calibration evidence
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path
          run_dir = Path(Path('/tmp/reward_v2_run_dir.txt').read_text(encoding='utf-8').strip())
          report = json.loads(
              (run_dir / 'diagnostics' / 'reward_calibration.json').read_text(
                  encoding='utf-8'
              )
          )
          assert report['lock_status'] == 'not_locked'
          assert report['training_numerics']['gamma'] == 1.0
          assert report['training_numerics']['stable_for_short_diagnostic'] is True
          assert set(report['reports']) == {
              'train_idle',
              'train_service_priority',
              'val_idle',
              'val_service_priority',
              'val_short_trained',
          }
          for name, item in report['reports'].items():
              assert item['split'] in {'train', 'val'}
              assert item['day_count'] == 8
              assert item['raw_component_distributions']
              assert item['config_hash']
          metadata = json.loads((run_dir / 'run_metadata.json').read_text(encoding='utf-8'))
          summary = json.loads((run_dir / 'summary.json').read_text(encoding='utf-8'))
          assert metadata['run_purpose'] == 'reward_calibration'
          assert metadata['formal_test_completed'] is False
          assert summary['run_purpose'] == 'reward_calibration'
          assert summary['formal_test_completed'] is False
          assert not (run_dir / 'test_summary.json').exists()
          print(json.dumps(report['marginal_tradeoffs'], indent=2))
          PY
      - name: Save calibration artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reward-v2-calibration-evidence
          path: /tmp/reward_v2_calibration/
          if-no-files-found: error
