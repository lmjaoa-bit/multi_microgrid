  action_design: single_dispatch_dr
  dispatch:
    priority_mode: renewable_load_first
  terminal_soc:
    mode: none
    tolerance: 0.03
    penalty_per_kwh: 1.5
  observation:
    future_horizon: 24
    noisy_forecast: true
    evaluation_forecast_noise: true
    mask_forecast_beyond_episode: true
    forecast_temporal_correlation: 0.8
    forecast_sigma_1h:
      load: 0.03
      ghi: 0.08
      wind_speed: 0.1
      price: 0.0
      temperature: 0.0
    forecast_error_max:
